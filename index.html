<script>
    // 🚀 VERSIÓN CON DATOS DE PRUEBA - SIN ERRORES
    let usuarioActual = null;

    // 📞 FUNCIÓN TEMPORAL CON DATOS DE PRUEBA
    async function callAPI(params) {
        console.log('Simulando API call:', params);
        
        // Simular delay de red
        await new Promise(resolve => setTimeout(resolve, 800));
        
        // DATOS DE PRUEBA PARA DESARROLLO
        if (params.action === 'login') {
            if (params.numero === '0001' && params.pin === '1234') {
                return {
                    success: true,
                    socio: {
                        numero: '0001',
                        nombre: 'Juan Perez',
                        telefono: '3794123456',
                        activo: true,
                        email: 'juan@coape.com'
                    }
                };
            }
            if (params.numero === '0002' && params.pin === '5678') {
                return {
                    success: true,
                    socio: {
                        numero: '0002',
                        nombre: 'Maria Lopez',
                        telefono: '3794987654',
                        activo: true,
                        email: 'maria@coape.com'
                    }
                };
            }
            if (params.numero === '9999' && params.pin === '9999') {
                return {
                    success: true,
                    socio: {
                        numero: '9999',
                        nombre: 'Administrador',
                        telefono: '3794000000',
                        activo: true,
                        email: 'admin@coape.com'
                    }
                };
            }
            return { success: false, error: 'Credenciales incorrectas' };
        }
        
        if (params.action === 'getMovimientos') {
            const movimientos = {
                '0001': [
                    { fecha: '2024-03-15', concepto: 'Venta miel', monto: 18500, tipo: 'ingreso', estado: 'confirmado' },
                    { fecha: '2024-03-10', concepto: 'Cuota social', monto: -3260, tipo: 'egreso', estado: 'pendiente' },
                    { fecha: '2024-03-05', concepto: 'Uso maquinaria', monto: -2100, tipo: 'egreso', estado: 'confirmado' }
                ],
                '0002': [
                    { fecha: '2024-03-18', concepto: 'Venta miel', monto: 22400, tipo: 'ingreso', estado: 'confirmado' },
                    { fecha: '2024-03-12', concepto: 'Cuota social', monto: -3260, tipo: 'egreso', estado: 'pendiente' }
                ],
                '9999': []
            };
            return { movimientos: movimientos[params.socioId] || [] };
        }
        
        if (params.action === 'getColmenas') {
            const colmenas = {
                '0001': [
                    { id: 'COL001', nombre: 'Colmena Norte', fecha: '2024-01-15', estado: 'Activa', ubicacion: 'Campo Norte' },
                    { id: 'COL002', nombre: 'Colmena Sur', fecha: '2024-02-01', estado: 'En desarrollo', ubicacion: 'Campo Sur' },
                    { id: 'COL003', nombre: 'Colmena Este', fecha: '2023-12-10', estado: 'Activa', ubicacion: 'Campo Este' }
                ],
                '0002': [
                    { id: 'COL004', nombre: 'Colmena Principal', fecha: '2024-01-10', estado: 'Activa', ubicacion: 'Campo Central' },
                    { id: 'COL005', nombre: 'Colmena Secundaria', fecha: '2024-02-15', estado: 'Activa', ubicacion: 'Campo Sur' }
                ],
                '9999': []
            };
            return { colmenas: colmenas[params.socioId] || [] };
        }
        
        if (params.action === 'addColmena') {
            // Simular agregar colmena
            const nuevaColmenaId = 'COL' + (Math.floor(Math.random() * 900) + 100);
            return { 
                success: true, 
                colmenaId: nuevaColmenaId,
                message: 'Colmena agregada exitosamente'
            };
        }
        
        if (params.action === 'registrarCura') {
            return { 
                success: true, 
                message: 'Cura registrada exitosamente' 
            };
        }
        
        if (params.action === 'getAdminData') {
            return {
                stats: {
                    totalSocios: 4,
                    sociosActivos: 3,
                    totalColmenas: 5,
                    colmenasActivas: 4
                }
            };
        }
        
        return { success: true, message: 'Acción simulada correctamente' };
    }

    // 🗂️ FUNCIONES PRINCIPALES 
    async function login() {
        const numero = document.getElementById('numeroSocio').value;
        const pin = document.getElementById('pinSocio').value;
        
        if (!numero || !pin) {
            alert('Por favor completa todos los campos');
            return;
        }

        // Mostrar loading
        const boton = event.target;
        const textoOriginal = boton.textContent;
        boton.textContent = '🔐 CONECTANDO...';
        boton.disabled = true;

        try {
            const result = await callAPI({
                action: 'login',
                numero: numero,
                pin: pin
            });
            
            if (result.success) {
                usuarioActual = result.socio;
                document.getElementById('nombreUsuario').textContent = `🍯 HOLA, ${usuarioActual.nombre.split(' ')[0]}`;
                mostrarScreen('mainScreen');
            } else {
                alert(result.error || 'Credenciales incorrectas');
            }
        } catch (error) {
            alert('Error de conexión: ' + error.message);
        } finally {
            // Restaurar botón
            boton.textContent = textoOriginal;
            boton.disabled = false;
        }
    }

    async function cargarCuentaScreen() {
        mostrarScreen('cuentaScreen');
        await cargarDatosUsuario();
    }

    async function cargarColmenasScreen() {
        mostrarScreen('colmenasScreen');
        await cargarColmenasUsuario();
    }

    async function cargarDatosUsuario() {
        if (!usuarioActual) return;

        // Actualizar información de pago
        document.getElementById('referenciaPago').textContent = `Socio ${usuarioActual.numero}`;
        document.getElementById('infoCuota').textContent = `$3.260 - Vence: ${obtenerProximoVencimiento()}`;
        
        // Cargar movimientos
        const result = await callAPI({
            action: 'getMovimientos',
            socioId: usuarioActual.numero
        });

        if (result.movimientos) {
            let saldo = 0;
            let htmlMovimientos = '';
            
            result.movimientos.forEach(mov => {
                saldo += parseFloat(mov.monto);
                const signo = mov.tipo === 'ingreso' ? '+' : '';
                const fechaFormateada = formatearFecha(mov.fecha);
                htmlMovimientos += `
                    <div class="movimiento">
                        <div>${fechaFormateada} - ${mov.concepto}</div>
                        <div class="${mov.tipo}">${signo}$${Math.abs(mov.monto).toLocaleString()}</div>
                    </div>
                `;
            });
            
            document.getElementById('saldoDisplay').textContent = `$${saldo.toLocaleString()}`;
            document.getElementById('saldoDisplay').className = `saldo ${saldo >= 0 ? 'positivo' : 'negativo'}`;
            document.getElementById('listaMovimientos').innerHTML = htmlMovimientos || '<div class="movimiento">No hay movimientos</div>';
            
            // Mostrar/ocultar sección de pagos si hay deuda
            const tieneDeuda = saldo < 0;
            document.getElementById('seccionPagos').style.display = tieneDeuda ? 'block' : 'none';
        }
    }

    async function cargarColmenasUsuario() {
        if (!usuarioActual) return;

        const result = await callAPI({
            action: 'getColmenas',
            socioId: usuarioActual.numero
        });

        if (result.colmenas) {
            let htmlColmenas = '';
            
            result.colmenas.forEach(colmena => {
                const claseEstado = colmena.estado.toLowerCase().replace(' ', '-');
                const fechaFormateada = formatearFecha(colmena.fecha);
                htmlColmenas += `
                    <div class="colmena-item ${claseEstado}">
                        <div><strong>${colmena.nombre}</strong> (${colmena.id})</div>
                        <div>Estado: ${colmena.estado}</div>
                        <div>Desde: ${fechaFormateada}</div>
                    </div>
                `;
            });
            
            document.getElementById('listaColmenas').innerHTML = htmlColmenas || '<div class="colmena-item">No hay colmenas registradas</div>';
        }
    }

    async function agregarColmena() {
        const nombre = document.getElementById('nombreColmena').value;
        const estado = document.getElementById('estadoColmena').value;
        
        if (!nombre) {
            alert('Ingresa un nombre para la colmena');
            return;
        }

        const result = await callAPI({
            action: 'addColmena',
            socioId: usuarioActual.numero,
            nombre: nombre,
            estado: estado
        });

        if (result.success) {
            alert(`✅ Colmena "${nombre}" agregada como ${estado}\nID: ${result.colmenaId}`);
            document.getElementById('nombreColmena').value = '';
            mostrarScreen('colmenasScreen');
            await cargarColmenasUsuario();
        } else {
            alert('Error al agregar colmena');
        }
    }

    async function registrarCura(accion) {
        const aplicada = accion === 'aplicada';
        const observaciones = accion === 'aplicada' ? 'Aplicado correctamente' : 'Pendiente';
        
        const result = await callAPI({
            action: 'registrarCura',
            socioId: usuarioActual.numero,
            tipoCura: 'Verano',
            aplicada: aplicada,
            observaciones: observaciones
        });

        if (result.success) {
            const mensajes = {
                'aplicada': '✅ ¡Cura registrada como aplicada!\nFecha: ' + new Date().toLocaleDateString('es-ES'),
                'no-aplicada': '⏰ Cura registrada como no aplicada. Te recordaremos en 3 días.',
                'programar': '📅 Cura programada para nueva fecha'
            };
            alert(mensajes[accion]);
            if (accion === 'programar') {
                const nuevaFecha = prompt('Ingresa nueva fecha (DD/MM/AAAA):');
                if (nuevaFecha) {
                    alert(`✅ Cura programada para: ${nuevaFecha}`);
                }
            }
            mostrarScreen('mainScreen');
        }
    }

    async function accesoAdmin() {
        const numero = document.getElementById('numeroSocio').value;
        const pin = document.getElementById('pinSocio').value;
        
        if (numero === "9999" && pin === "9999") {
            usuarioActual = { nombre: "Administrador", numero: "9999" };
            await cargarDashboardAdmin();
            mostrarScreen('adminScreen');
        } else {
            alert('Credenciales de administrador incorrectas');
        }
    }

    async function cargarDashboardAdmin() {
        const result = await callAPI({
            action: 'getAdminData'
        });

        if (result.stats) {
            document.getElementById('totalSocios').textContent = result.stats.totalSocios;
            document.getElementById('sociosActivos').textContent = result.stats.sociosActivos;
            document.getElementById('totalColmenas').textContent = result.stats.totalColmenas;
            document.getElementById('colmenasActivas').textContent = result.stats.colmenasActivas;
            
            // Datos de ejemplo para lista de socios
            const htmlSocios = `
                <div class="user-item">
                    <div>
                        <strong>Juan Perez</strong><br>
                        <small>ID: 0001 | Tel: 3794123456</small><br>
                        <small>Colmenas: 3 | Saldo: $13,140</small>
                    </div>
                    <div class="badge badge-activo">ACTIVO</div>
                </div>
                <div class="user-item">
                    <div>
                        <strong>Maria Lopez</strong><br>
                        <small>ID: 0002 | Tel: 3794987654</small><br>
                        <small>Colmenas: 2 | Saldo: $19,140</small>
                    </div>
                    <div class="badge badge-activo">ACTIVO</div>
                </div>
            `;
            document.getElementById('listaSociosAdmin').innerHTML = htmlSocios;
        }
    }

    // 🔄 FUNCIONES AUXILIARES
    function formatearFecha(fechaStr) {
        try {
            const fecha = new Date(fechaStr);
            return fecha.toLocaleDateString('es-ES');
        } catch (e) {
            return fechaStr;
        }
    }

    function obtenerProximoVencimiento() {
        const hoy = new Date();
        const proximo = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 10);
        return formatearFecha(proximo);
    }

    function mostrarScreen(screenId) {
        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.remove('active');
        });
        document.getElementById(screenId).classList.add('active');
    }

    function logout() {
        usuarioActual = null;
        document.getElementById('numeroSocio').value = '';
        document.getElementById('pinSocio').value = '';
        mostrarScreen('loginScreen');
    }

    // 💰 FUNCIONES DE PAGO
    function abrirMercadoPago() {
        alert('🔗 Abriendo Mercado Pago...\n\nEn la versión final esto abrirá la app de Mercado Pago con el monto pre-cargado.');
        
        // Simulación de pago exitoso
        setTimeout(() => {
            const confirmar = confirm('¿Completaste el pago en Mercado Pago?');
            if (confirmar) {
                alert('✅ Pago registrado exitosamente\nTu cuota ha sido marcada como pagada.');
                mostrarScreen('mainScreen');
            }
        }, 1000);
    }

    function copiarCVU() {
        navigator.clipboard.writeText("0000003100000000000000");
        alert('✅ CVU copiado al portapapeles\n\nPega este CVU en tu app de banco o Mercado Pago');
    }

    function copiarAlias() {
        navigator.clipboard.writeText("coape.cuota");
        alert('✅ Alias copiado al portapapeles\n\nPega este alias en tu app de banco');
    }

    function copiarMonto() {
        navigator.clipboard.writeText("3260");
        alert('✅ Monto copiado al portapapeles\n\nPega este monto en tu app de banco: $3.260');
    }

    function copiarReferencia() {
        const referencia = `Socio ${usuarioActual ? usuarioActual.numero : '0001'}`;
        navigator.clipboard.writeText(referencia);
        alert('✅ Referencia copiada al portapapeles\n\nPega esta referencia en el concepto de la transferencia');
    }

    function marcarPagoEfectivo() {
        const confirmar = confirm('¿Confirmas que pagaste en efectivo en la cooperativa?');
        if (confirmar) {
            alert('✅ Pago en efectivo registrado\nEl administrador verificará tu pago.');
            mostrarScreen('mainScreen');
        }
    }

    function recuperarPin() {
        alert('📱 Función de recuperación de PIN - En desarrollo\n\nContacta al administrador: 3794-000000');
        mostrarScreen('loginScreen');
    }

    // 🚀 INICIALIZACIÓN
    document.getElementById('numeroSocio').focus();
</script>
